name: Execute the SonarCloud Quality Gateway Analisys
on:
  push:
    branches:
      - production
  pull_request:
    types: [opened, synchronize, reopened]
# A imagem do CodeBuild define GOPATH com dois caminhos, que o setup-go@v1/v2 não suporta
env:
  GOPATH: /root/go

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: codebuild-madeiramadeira-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Test with go 1.17
        uses: actions/setup-go@v2
        with:
          go-version: '1.17'
      - run: go test -json -coverprofile=cover.out ./... > result.json
      
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
